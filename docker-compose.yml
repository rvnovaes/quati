name: ezl

x-app: &app
  image: ezl:latest
  build:
    context: .
    dockerfile: containers/web/Dockerfile
    args:
      requirements_file: ${REQUIREMENTS_FILE:-production.txt}
  env_file: .env
  volumes:
    - .:/app
    - web-media:/app/media
    - web-static:/app/staticfiles
    - ezl-logs:/var/log/ezl
  logging:
    driver: json-file
    options:
      max-size: "50m"
  restart: unless-stopped

volumes:
  db-data:
  web-media:
  web-static:
  ezl-logs:
  rabbitmq-data:

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ezl}
      POSTGRES_USER: ${DB_USER:-ezl}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ezl}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./containers/db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  queues:
    image: rabbitmq:3-management-alpine
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  postfix:
    image: boky/postfix:latest
    environment:
      HOSTNAME: ${POSTFIX_HOSTNAME:-mail.localhost}
      ALLOWED_SENDER_DOMAINS: ${POSTFIX_ALLOWED_SENDER_DOMAINS:-ezlawyer.com.br}
      RELAYHOST: ${POSTFIX_RELAYHOST:-}
      RELAYHOST_USERNAME: ${POSTFIX_RELAYHOST_USERNAME:-}
      RELAYHOST_PASSWORD: ${POSTFIX_RELAYHOST_PASSWORD:-}
      ALLOW_EMPTY_SENDER_DOMAINS: "true"
    restart: unless-stopped

  web:
    <<: *app
    command: gunicorn ezl.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 600
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      queues:
        condition: service_healthy

  ws:
    <<: *app
    command: daphne -b 0.0.0.0 -p 8002 --proxy-headers ezl.asgi:application
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: celery -A ezl worker -l info --concurrency ${CELERY_CONCURRENCY:-4} -Ofair
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      queues:
        condition: service_healthy

  beat:
    <<: *app
    command: celery -A ezl beat -l info --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    depends_on:
      - worker

  flower:
    <<: *app
    command: celery -A ezl flower --port=5555 --basic_auth=${FLOWER_BASIC_AUTH:-ezl:flower}
    depends_on:
      - worker

  nginx:
    image: nginx:1.27-alpine
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
    volumes:
      - ./containers/nginx/templates:/etc/nginx/templates:ro
      - web-static:/usr/share/nginx/html/static:ro
      - web-media:/usr/share/nginx/html/media:ro
    depends_on:
      - web
      - ws
    restart: unless-stopped
